name: Build radare2 for iOS (Rootless)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone radare2
        run: git clone https://github.com/radareorg/radare2.git

      - name: Install dependencies
        run: |
          brew install automake autoconf libtool pkg-config

      - name: Build for iOS
        run: |
          cd radare2
          ./configure --host=arm64-apple-darwin \
                      --prefix=/var/jb \
                      --without-libuv \
                      --without-openssl \
                      --disable-r2pm
          make -j$(sysctl -n hw.ncpu)

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: radare2-ios-arm64
          path: radare2/binr/radare2/radare2
